<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Valentine's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-image: url("https://marketplace.canva.com/EAEUf1ZOyzE/1/0/1600w/canva-pink-and-red-powerful-femme-personal-pattern-valentine%27s-day-desktop-wallpaper-vyLmDobNXOc.jpg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
}

/* Back Arrow */
.back-btn {
    position: fixed;
    top: 25px;
    left: 25px;
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: white;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(255, 105, 135, 0.4);
    transition: 0.3s ease;
    z-index: 9999;
}

.back-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 30px rgba(255, 105, 135, 0.6);
}

/* Blur overlay */
.overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh; /* changed from height to min-height for mobile */
    padding: 20px; /* prevents edge touching on small screens */
    backdrop-filter: blur(6px);
}

/* Letter Card */
.letter {
    background: white;
    padding: 60px 50px;
    max-width: 650px;
    width: 100%; /* allows shrinking */
    border-radius: 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    text-align: center;
    animation: fadeUp 1.5s ease forwards;
    opacity: 0;
}

/* Title */
.letter h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3rem;
    margin: 0 0 20px;
    color: #d6336c;
}

/* Paragraph text */
.letter p {
    font-size: 1.1rem;
    line-height: 1.7;
    margin: 15px 0;
    color: #333;
}

/* Closing */
.letter h2 {
    margin-top: 35px;
    font-family: 'Great Vibes', cursive;
    font-size: 2rem;
    color: #ff4d88;
}

/* Button */
.surprise-btn {
    margin-top: 30px;
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s ease;
}

.surprise-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(255, 105, 135, 0.4);
}

/* Entrance Animation */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile Adjustments (no visual change on desktop) */
@media (max-width: 600px) {

    .letter {
        padding: 40px 25px;
    }

    .letter h1 {
        font-size: 2.2rem;
    }

    .letter h2 {
        font-size: 1.6rem;
    }

    .letter p {
        font-size: 1rem;
    }

}

</style>
</head>

<body>

<a href="index.html" class="back-btn">&#10094;</a>

<div class="overlay">
    <div class="letter">
        <h1>To My Favorite Person ❤️</h1>

        <p>
            Happy Valentine’s Day, baby.
        </p>

        <p>
            Every single day with you feels like a blessing.
            You make my world brighter, softer, and a whole lot sweeter.
        </p>

        <p>
            I can’t wait to make more memories with you —
            more laughs, more late nights, more everything.
        </p>

        <h2>Forever Yours, Kiran 💕</h2>

        <button class="surprise-btn"
            onclick="alert('You are my forever Valentine ❤️')">
            One More Thing...
        </button>
    </div>
</div>

</body>
</html>
